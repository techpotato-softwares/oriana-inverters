name: Seed Payload CMS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, qa, prod]
        default: qa
      seed_type:
        description: What to seed
        required: true
        type: choice
        options: [catalogue, content, admin, full]
        default: catalogue
      admin_email:
        description: Admin email (workflow input only — not stored as a GitHub secret)
        required: false
        type: string
      admin_password:
        description: Admin password (workflow input only — not stored as a GitHub secret)
        required: false
        type: string
      admin_name:
        description: Admin name
        required: false
        type: string

permissions:
  contents: read

# Only AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY as GitHub secrets.
# DATABASE_URL / DB password / Payload secrets come from AWS Secrets Manager.

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  NODE_VERSION: "22"

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure secrets exist
        run: ./scripts/bootstrap-secrets.sh "${{ github.event.inputs.environment }}"

      - name: Sync RDS app secret (prod)
        if: ${{ github.event.inputs.environment == 'prod' }}
        run: |
          chmod +x ./scripts/sync-rds-app-secret.sh ./scripts/ensure-rds-available.sh
          RDS_INSTANCE_ID=oriana-web ./scripts/ensure-rds-available.sh
          RDS_INSTANCE_ID=oriana-web DB_SCHEMA=oriana_invertors \
            ./scripts/sync-rds-app-secret.sh prod

      - name: Load secrets from Secrets Manager
        run: |
          ENV="${{ github.event.inputs.environment }}"
          eval "$(./scripts/load-deploy-secrets.sh "$ENV")"

          if [ "$DB_PASSWORD" = "CHANGE_ME_UPDATE_IN_AWS_CONSOLE" ]; then
            echo "Update DB_PASSWORD in Secrets Manager /oriana-invertors-web/$ENV/database (QA) or run sync-rds-app-secret.sh (prod)"
            exit 1
          fi

          echo "::add-mask::$PAYLOAD_SECRET"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DB_PASSWORD"

          {
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
            echo "PREVIEW_SECRET=$PREVIEW_SECRET"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DB_SCHEMA=${DB_SCHEMA:-}"
            echo "PAYLOAD_DB_SCHEMA=${PAYLOAD_DB_SCHEMA:-}"
          } >> "$GITHUB_ENV"

          # Never pass schemaName=public to Payload (Drizzle rejects it)
          if [ "${PAYLOAD_DB_SCHEMA:-}" = "public" ] || [ "${DB_SCHEMA:-}" = "public" ]; then
            echo "PAYLOAD_DB_SCHEMA=" >> "$GITHUB_ENV"
            echo "DB_SCHEMA=" >> "$GITHUB_ENV"
          fi

      - name: Bootstrap schema (push tables)
        working-directory: apps/cms
        env:
          # Payload only drizzle-pushes when NODE_ENV !== production
          NODE_ENV: development
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          PAYLOAD_FORCE_SCHEMA_PUSH: "true"
          PAYLOAD_FORCE_DRIZZLE_PUSH: "true"
          PG_POOL_MAX: "3"
          PG_CONNECT_TIMEOUT_MS: "60000"
        run: npm run schema:push

      - name: Seed catalogue
        if: ${{ github.event.inputs.seed_type == 'catalogue' || github.event.inputs.seed_type == 'full' }}
        working-directory: apps/cms
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run seed:catalogue

      - name: Seed marketing content
        if: ${{ github.event.inputs.seed_type == 'content' || github.event.inputs.seed_type == 'full' }}
        working-directory: apps/cms
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run seed:content

      - name: Seed admin user
        if: ${{ github.event.inputs.seed_type == 'admin' || github.event.inputs.seed_type == 'full' }}
        working-directory: apps/cms
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          ADMIN_EMAIL: ${{ github.event.inputs.admin_email }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}
          ADMIN_NAME: ${{ github.event.inputs.admin_name || 'Admin' }}
        run: |
          echo "::add-mask::$ADMIN_PASSWORD"
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Provide admin_email and admin_password as workflow inputs (not GitHub secrets)"
            exit 1
          fi
          npm run seed:admin

      - name: Summary
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "### Seed complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`$ENV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seed type: \`${{ github.event.inputs.seed_type }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ENV" = "prod" ]; then
            echo "- RDS: \`oriana-web\` / schema \`oriana_invertors\`" >> "$GITHUB_STEP_SUMMARY"
          fi
