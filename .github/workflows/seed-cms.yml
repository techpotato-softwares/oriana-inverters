name: Seed Payload CMS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, qa, prod]
        default: qa
      seed_type:
        description: What to seed (site = pages/globals + catalogue; full = site + admin)
        required: true
        type: choice
        options: [site, catalogue, admin, full]
        default: site
      skip_schema_push:
        description: Skip schema:push (use if tables already exist / push hung previously)
        required: false
        type: boolean
        default: false
      admin_email:
        description: Admin email (required for admin/full)
        required: false
        type: string
      admin_password:
        description: Admin password (required for admin/full)
        required: false
        type: string
      admin_name:
        description: Admin name
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  NODE_VERSION: "22"

jobs:
  seed:
    runs-on: ubuntu-latest
    # Whole job must not hang forever on pooler/Drizzle
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure secrets exist
        run: ./scripts/bootstrap-secrets.sh "${{ github.event.inputs.environment }}"

      - name: Load secrets
        run: |
          ENV="${{ github.event.inputs.environment }}"
          eval "$(./scripts/load-deploy-secrets.sh "$ENV")"

          if [ "$DB_PASSWORD" = "CHANGE_ME_UPDATE_IN_AWS_CONSOLE" ]; then
            echo "Update DB_PASSWORD in /oriana-invertors-web/$ENV/database before seeding"
            exit 1
          fi

          echo "::add-mask::$PAYLOAD_SECRET"
          echo "::add-mask::$DATABASE_URL"

          # Fail TCP connect quickly instead of hanging on a saturated pooler
          case "$DATABASE_URL" in
            *\?*) DATABASE_URL="${DATABASE_URL}&connect_timeout=15" ;;
            *)    DATABASE_URL="${DATABASE_URL}?connect_timeout=15" ;;
          esac

          {
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
            echo "PREVIEW_SECRET=$PREVIEW_SECRET"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "LAMBDA_FN=oriana-invertors-web-$ENV"
          } >> "$GITHUB_ENV"

      - name: Pause Lambda (free Supabase session slots)
        run: |
          FN="${{ env.LAMBDA_FN }}"
          if aws lambda get-function --function-name "$FN" >/dev/null 2>&1; then
            echo "Setting reserved concurrency=0 on $FN to free DB pooler sessions"
            aws lambda put-function-concurrency \
              --function-name "$FN" \
              --reserved-concurrent-executions 0
            sleep 8
          else
            echo "Lambda $FN not found — continuing without pause"
          fi

      - name: Probe DB connectivity
        if: ${{ github.event.inputs.skip_schema_push != 'true' }}
        working-directory: apps/cms
        env:
          NODE_OPTIONS: "--no-deprecation --dns-result-order=ipv4first"
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg'
          const url = process.env.DATABASE_URL
          if (!url) {
            console.error('DATABASE_URL missing')
            process.exit(1)
          }
          const client = new pg.Client({
            connectionString: url,
            connectionTimeoutMillis: 15_000,
            ssl: url.includes('sslmode=require') ? { rejectUnauthorized: false } : undefined,
          })
          try {
            await client.connect()
            const r = await client.query('select 1 as ok')
            console.log('DB probe ok:', r.rows[0])
          } catch (e) {
            console.error('DB probe failed — Supabase pooler likely saturated or unreachable from GHA.')
            console.error(String(e))
            console.error('Fix: wait a few minutes, pause other clients, or run schema:push locally, then re-run with skip_schema_push=true')
            process.exit(1)
          } finally {
            try { await client.end() } catch { /* ignore */ }
          }
          EOF

      - name: Bootstrap schema (push tables)
        if: ${{ github.event.inputs.skip_schema_push != 'true' }}
        working-directory: apps/cms
        timeout-minutes: 8
        env:
          NODE_OPTIONS: "--no-deprecation --dns-result-order=ipv4first"
          # Drizzle introspect is sequential; keep pool tiny on Supabase session mode
          PG_POOL_MAX: "1"
          PG_CONNECT_TIMEOUT_MS: "20000"
          SCHEMA_PUSH_RETRIES: "3"
          SCHEMA_PUSH_PAUSE_MS: "3000"
        run: |
          # Hard shell timeout so the step cannot hang past ~6 minutes
          timeout 360 npm run schema:push

      - name: Seed site content (pages, globals, chrome + catalogue)
        if: ${{ github.event.inputs.seed_type == 'site' || github.event.inputs.seed_type == 'full' }}
        working-directory: apps/cms
        timeout-minutes: 15
        env:
          NODE_OPTIONS: "--no-deprecation --dns-result-order=ipv4first"
          PG_POOL_MAX: "1"
          PG_CONNECT_TIMEOUT_MS: "60000"
        run: |
          # Brief settle after schema:push so pooler recycles the previous session
          sleep 5
          npm run seed:site

      - name: Seed catalogue only
        if: ${{ github.event.inputs.seed_type == 'catalogue' }}
        working-directory: apps/cms
        timeout-minutes: 10
        env:
          NODE_OPTIONS: "--no-deprecation --dns-result-order=ipv4first"
          PG_POOL_MAX: "1"
          PG_CONNECT_TIMEOUT_MS: "60000"
        run: |
          sleep 5
          npm run seed:catalogue

      - name: Seed admin user
        if: ${{ github.event.inputs.seed_type == 'admin' || github.event.inputs.seed_type == 'full' }}
        working-directory: apps/cms
        env:
          NODE_OPTIONS: "--no-deprecation --dns-result-order=ipv4first"
          PG_POOL_MAX: "1"
          PG_CONNECT_TIMEOUT_MS: "60000"
          ADMIN_EMAIL: ${{ github.event.inputs.admin_email }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}
          ADMIN_NAME: ${{ github.event.inputs.admin_name || 'Admin' }}
        run: |
          echo "::add-mask::$ADMIN_PASSWORD"
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Provide admin_email and admin_password inputs for admin/full seed"
            exit 1
          fi
          sleep 3
          npm run seed:admin

      - name: Restore Lambda concurrency
        if: always()
        run: |
          FN="${{ env.LAMBDA_FN }}"
          if [ -n "$FN" ] && aws lambda get-function --function-name "$FN" >/dev/null 2>&1; then
            echo "Removing reserved concurrency cap on $FN"
            aws lambda delete-function-concurrency --function-name "$FN" || true
          fi

      - name: Summary
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "### Seed complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`$ENV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seed type: \`${{ github.event.inputs.seed_type }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skip schema push: \`${{ github.event.inputs.skip_schema_push }}\`" >> "$GITHUB_STEP_SUMMARY"
