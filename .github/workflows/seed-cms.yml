name: Seed Payload CMS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: qa
      seed_type:
        description: What to seed
        required: true
        type: choice
        options:
          - catalogue
          - admin
          - full
        default: catalogue

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  NODE_VERSION: "22"

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure secrets exist
        run: |
          chmod +x scripts/bootstrap-secrets.sh
          ./scripts/bootstrap-secrets.sh "${{ github.event.inputs.environment }}"

      - name: Load secrets
        run: |
          ENV="${{ github.event.inputs.environment }}"
          chmod +x scripts/load-deploy-secrets.sh
          eval "$(./scripts/load-deploy-secrets.sh "$ENV")"

          if [ "$DB_PASSWORD" = "CHANGE_ME_UPDATE_IN_AWS_CONSOLE" ]; then
            echo "Update DB_PASSWORD in /oriana-invertors-web/$ENV/database before seeding"
            exit 1
          fi

          echo "::add-mask::$PAYLOAD_SECRET"
          echo "::add-mask::$DATABASE_URL"

          {
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
            echo "PREVIEW_SECRET=$PREVIEW_SECRET"
            echo "DATABASE_URL=$DATABASE_URL"
          } >> "$GITHUB_ENV"

      - name: Migrate schema
        working-directory: apps/cms
        env:
          PAYLOAD_DATABASE_PUSH: "true"
        run: npm run migrate || true

      - name: Seed catalogue
        if: ${{ github.event.inputs.seed_type == 'catalogue' || github.event.inputs.seed_type == 'full' }}
        working-directory: apps/cms
        run: npm run seed:catalogue

      - name: Seed admin user
        if: ${{ github.event.inputs.seed_type == 'admin' || github.event.inputs.seed_type == 'full' }}
        working-directory: apps/cms
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME || 'Admin' }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Set GitHub secrets ADMIN_EMAIL and ADMIN_PASSWORD for this environment"
            exit 1
          fi
          npm run seed:admin

      - name: Summary
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "### Seed complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`$ENV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seed type: \`${{ github.event.inputs.seed_type }}\`" >> "$GITHUB_STEP_SUMMARY"
