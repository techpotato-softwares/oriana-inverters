name: Deploy oriana-invertors-web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, qa, prod]
        default: qa
      db_password:
        description: Optional DB password (for first-time bootstrap)
        required: false
        type: string
      skip_migrate:
        description: Skip database migrate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'qa') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then ENV=prod; else ENV=qa; fi
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "stack=oriana-invertors-web-$ENV" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK bootstrap
        working-directory: cdk
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap "aws://${ACCOUNT}/${AWS_REGION}"

      - name: Bootstrap secrets
        env:
          DB_PASSWORD_OVERRIDE: ${{ github.event.inputs.db_password }}
        run: |
          if [ -n "${DB_PASSWORD_OVERRIDE:-}" ]; then echo "::add-mask::$DB_PASSWORD_OVERRIDE"; fi
          ./scripts/bootstrap-secrets.sh "${{ steps.env.outputs.environment }}"

      - name: Load secrets
        id: secrets
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          eval "$(./scripts/load-deploy-secrets.sh "$ENV")"

          echo "::add-mask::$PAYLOAD_SECRET"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DB_PASSWORD"

          {
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
            echo "PREVIEW_SECRET=$PREVIEW_SECRET"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "PAYLOAD_SECRET_PLACEHOLDER=$PAYLOAD_SECRET"
            echo "CRON_SECRET_PLACEHOLDER=$CRON_SECRET"
            echo "PREVIEW_SECRET_PLACEHOLDER=$PREVIEW_SECRET"
          } >> "$GITHUB_ENV"

          if [ "$DB_PASSWORD" = "CHANGE_ME_UPDATE_IN_AWS_CONSOLE" ]; then
            echo "db_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "db_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap schema (push tables)
        if: ${{ github.event.inputs.skip_migrate != 'true' && steps.secrets.outputs.db_ready == 'true' }}
        working-directory: apps/cms
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run schema:push

      - name: Build CMS
        working-directory: apps/cms
        env:
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'https://placeholder.cloudfront.net' }}
          NEXT_IMAGE_UNOPTIMIZED: 'true'
          PAYLOAD_SECRET: ${{ env.PAYLOAD_SECRET }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run build:next

      - name: CDK deploy
        working-directory: cdk
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ env.PAYLOAD_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          PREVIEW_SECRET: ${{ env.PREVIEW_SECRET }}
        run: npx cdk deploy "${{ steps.env.outputs.stack }}" --require-approval never --outputs-file cdk-outputs.json

      - name: Sync Lambda env with CloudFront URL
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          STACK="${{ steps.env.outputs.stack }}"
          OUT=cdk/cdk-outputs.json
          FN="oriana-invertors-web-$ENV"

          CF_URL=$(jq -r --arg s "$STACK" '.[$s] | to_entries[] | select(.key|test("CloudFrontURL")) | .value' "$OUT" 2>/dev/null | head -1)
          MEDIA_BUCKET=$(jq -r --arg s "$STACK" '.[$s] | to_entries[] | select(.key|test("MediaBucketName")) | .value' "$OUT" 2>/dev/null | head -1)

          aws lambda get-function-configuration --function-name "$FN" --query 'Environment.Variables' --output json > /tmp/env.json 2>/dev/null || echo '{}' > /tmp/env.json

          jq \
            --arg url "${CF_URL:-https://placeholder.cloudfront.net}" \
            --arg db "$DATABASE_URL" \
            --arg ps "$PAYLOAD_SECRET" \
            --arg cs "$CRON_SECRET" \
            --arg prs "$PREVIEW_SECRET" \
            --arg bucket "${MEDIA_BUCKET:-}" \
            --arg region "$AWS_REGION" \
            '{Variables: (. + {PAYLOAD_SERVER_URL: $url, NEXT_PUBLIC_SERVER_URL: $url, DATABASE_URL: $db, PAYLOAD_SECRET: $ps, CRON_SECRET: $cs, PREVIEW_SECRET: $prs, S3_BUCKET: $bucket, S3_REGION: $region, NEXT_IMAGE_UNOPTIMIZED: "true", NEXT_TELEMETRY_DISABLED: "1", AWS_LWA_ENABLE_COMPRESSION: "false", AWS_LWA_INVOKE_MODE: "buffered", PAYLOAD_CACHE_COMPONENTS_ENABLED: "true"})}' \
            /tmp/env.json > /tmp/lambda-env.json

          # Pass via file to avoid shell quoting issues with nested JSON
          aws lambda update-function-configuration \
            --function-name "$FN" \
            --environment file:///tmp/lambda-env.json

          aws lambda wait function-updated --function-name "$FN" || true

          {
            echo "### Deployed oriana-invertors-web"
            echo "- Environment: \`$ENV\`"
            echo "- Stack: \`$STACK\`"
            if [ -n "$CF_URL" ] && [ "$CF_URL" != "null" ]; then
              echo "- CloudFront: $CF_URL"
              echo "- Admin: $CF_URL/admin"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync Next.js static assets to S3
        run: |
          chmod +x ./scripts/sync-next-static-to-s3.sh
            ENV="${{ steps.env.outputs.environment }}"
          FN="oriana-invertors-web-$ENV"

          # Docker rebuilds Next inside the image, so CI .next hashes do not match.
          # Extract the exact static tree from the deployed Lambda image.
          IMAGE_URI=$(aws lambda get-function --function-name "$FN" --query 'Code.ImageUri' --output text)
          if [ -z "$IMAGE_URI" ] || [ "$IMAGE_URI" = "None" ]; then
            echo "Lambda image URI not found; falling back to HTML scrape sync"
            ./scripts/sync-next-static-to-s3.sh "$ENV" --wait-seconds 240
            exit 0
          fi

          REGISTRY="${IMAGE_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE_URI"
          CONTAINER_ID=$(docker create "$IMAGE_URI")
          rm -rf /tmp/lambda-next-static
          docker cp "$CONTAINER_ID:/app/apps/cms/.next/static" /tmp/lambda-next-static
          docker rm "$CONTAINER_ID"

          ./scripts/sync-next-static-to-s3.sh "$ENV" --source-dir /tmp/lambda-next-static
